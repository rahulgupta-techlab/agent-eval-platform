# Questions answered from the policy documents alone.

- id: docs-001
  category: docs
  difficulty: easy
  prompt: How long do I have to return a rain jacket?
  expected_calls:
    - tool: search_docs
      args: {query: return window days}
    - tool: read_doc
      args: {doc_id: returns}
  expected_answer: {type: contains, values: [[30 days, thirty days]]}

